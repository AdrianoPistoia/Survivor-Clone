<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect width="512" height="512" rx="80" fill="#111122"/>
  <!-- Arena border glow -->
  <rect x="40" y="40" width="432" height="432" rx="24" fill="none" stroke="#ff4444" stroke-width="6" opacity="0.6"/>
  <!-- Player character (blue square) -->
  <rect x="216" y="216" width="80" height="80" rx="8" fill="#4488ff"/>
  <!-- XP gems -->
  <polygon points="120,180 136,200 120,220 104,200" fill="#44ff44"/>
  <polygon points="380,290 396,310 380,330 364,310" fill="#44ff44"/>
  <polygon points="150,340 166,360 150,380 134,360" fill="#44ff44" opacity="0.7"/>
  <!-- Enemies (red circles) -->
  <circle cx="140" cy="140" r="28" fill="#ff4444"/>
  <circle cx="370" cy="150" r="28" fill="#ff4444"/>
  <circle cx="150" cy="370" r="28" fill="#ff4444"/>
  <circle cx="372" cy="372" r="28" fill="#ff4444"/>
  <!-- Aura ring around player -->
  <circle cx="256" cy="256" r="100" fill="none" stroke="#44ffff" stroke-width="3" opacity="0.4"/>
  <!-- Whip slash lines -->
  <line x1="296" y1="256" x2="380" y2="220" stroke="white" stroke-width="4" opacity="0.8" stroke-linecap="round"/>
  <line x1="296" y1="256" x2="390" y2="270" stroke="white" stroke-width="3" opacity="0.5" stroke-linecap="round"/>
  <!-- Title text -->
  <text x="256" y="490" font-family="monospace" font-size="28" fill="#ffffff" text-anchor="middle" font-weight="bold" opacity="0.9">SURVIVOR</text>
</svg>
