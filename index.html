<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Survivor Clone</title>

  <!-- PWA manifest -->
  <link rel="manifest" href="/manifest.json" />

  <!-- Theme & status bar -->
  <meta name="theme-color" content="#111122" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Survivor" />
  <meta name="application-name" content="Survivor Clone" />
  <meta name="msapplication-starturl" content="/" />
  <meta name="msapplication-TileColor" content="#111122" />
  <link rel="apple-touch-icon" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="apple-touch-icon" sizes="512x512" href="/icons/icon-512.png" />

  <!-- App icon (for iOS Safari and general use) -->
  <link rel="apple-touch-icon" href="/icons/icon.svg" />
  <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #111;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      padding-top: env(safe-area-inset-top);
      padding-bottom: env(safe-area-inset-bottom);
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }
    #orientation-lock {
      display: none;
      position: fixed;
      z-index: 9999;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(17,17,34,0.95);
      color: #fff;
      font-size: 2.2em;
      text-align: center;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      padding: 2em;
    }
    #orientation-lock.visible {
      display: flex;
    }
  </style>
</head>
<body>
  <div id="orientation-lock">Please rotate your device to landscape mode to play.</div>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Register service worker for PWA/offline support
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js')
          .then(reg => console.log('[SW] Registered, scope:', reg.scope))
          .catch(err => console.warn('[SW] Registration failed:', err));
      });
    }
    // Orientation lock overlay
    function checkOrientation() {
      const lock = document.getElementById('orientation-lock');
      if (window.innerWidth < window.innerHeight) {
        lock.classList.add('visible');
      } else {
        lock.classList.remove('visible');
      }
    }
    window.addEventListener('resize', checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
    window.addEventListener('DOMContentLoaded', checkOrientation);
  </script>
</body>
</html>
